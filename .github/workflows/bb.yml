name: Build Server Repository

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create server structure
        shell: bash
        run: |
          set -e

          mkdir -p server/api
          mkdir -p server/services
          mkdir -p server/workspace/Original
          mkdir -p server/workspace/Unpack
          mkdir -p server/workspace/Editor
          mkdir -p server/workspace/Repack

          touch server/__init__.py
          touch server/api/__init__.py
          touch server/services/__init__.py

      - name: Create server requirements
        shell: bash
        run: |
          cat > server/requirements.txt <<'EOF'
          fastapi
          uvicorn[standard]
          python-multipart
          pydantic
          EOF

      - name: Create API server
        shell: bash
        run: |
          cat > server/main.py <<'PY'
          from fastapi import FastAPI
          from fastapi.middleware.cors import CORSMiddleware

          app = FastAPI(
              title="Pak Workspace Server",
              version="1.0.0"
          )

          app.add_middleware(
              CORSMiddleware,
              allow_origins=["*"],
              allow_credentials=True,
              allow_methods=["*"],
              allow_headers=["*"],
          )

          @app.get("/")
          async def root():
              return {
                  "status": "online",
                  "service": "pak-server"
              }

          @app.get("/api/health")
          async def health():
              return {
                  "status": "ok",
                  "api": "online"
              }

          @app.get("/api/workspace")
          async def workspace():
              return {
                  "folders": [
                      "Original",
                      "Unpack",
                      "Editor",
                      "Repack"
                  ]
              }
          PY

      - name: Add workspace README files
        shell: bash
        run: |
          echo "Original input files go here." \
            > server/workspace/Original/README.txt

          echo "Unpacked files go here." \
            > server/workspace/Unpack/README.txt

          echo "Supported editable files go here." \
            > server/workspace/Editor/README.txt

          echo "Generated output files go here." \
            > server/workspace/Repack/README.txt

      - name: Validate Python
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          python -m compileall server

      - name: Show repository structure
        shell: bash
        run: |
          find server -type f | sort

      - name: Commit and push generated files
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add server/

          if git diff --cached --quiet; then
            echo "No server changes to commit."
            exit 0
          fi

          git commit -m "Build server repository structure"
          git push origin HEAD:main